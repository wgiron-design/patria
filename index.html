<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="1; url=main/" />
  <title>Fiestas Patrias 205 Aniversario — Guatemala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% 20%, #002875 0%, #000E2A 70%);
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255,215,0,0.5);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    p {
      color: rgba(255,255,255,0.75);
      font-size: 0.95rem;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      max-width: 560px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      background: rgba(0, 40, 110, 0.7);
      border: 1.5px solid #FFD700;
      color: #FFF9C4;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .btn:hover {
      background: #1565C0;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255,215,0,0.4);
    }
    .note {
      margin-top: 30px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>
  <div class="badge">205</div>
  <h1>Fiestas Patrias de Guatemala</h1>
  <p>Conmemoración del 205 Aniversario de la Independencia Nacional (1821 – 2026).</p>
  
  <div class="links">
    <a href="main/" class="btn">&#127916; Pantalla Principal (Evento)</a>
    <a href="form/" class="btn">&#9997;&#65039; Formulario de Invitados</a>
    <a href="verificar/" class="btn">&#128269; Verificaci&oacute;n de C&oacute;digos</a>
  </div>

  <div class="note">Redirigiendo a la pantalla principal en unos instantes&hellip;</div>
</body>
</html>
